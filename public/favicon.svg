<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="globe-clip">
      <circle cx="32" cy="32" r="30" />
    </clipPath>
    <linearGradient id="top-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="bottom-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#4D7C0F" />
    </linearGradient>
  </defs>

  <!-- Outer Sphere Base -->
  <circle cx="32" cy="32" r="31" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />

  <g clip-path="url(#globe-clip)">
    <!-- Blue Upper Ocean -->
    <rect x="0" y="0" width="64" height="34" fill="url(#top-grad)" />
    <!-- Green Lower Landmass/Base -->
    <rect x="0" y="30" width="64" height="34" fill="url(#bottom-grad)" />

    <!-- Grid / Latitude / Longitude lines -->
    <path d="M32 2 A30 30 0 0 0 32 62 M2 A32 32 0 0 1 62 32 M6 18 Q32 25 58 18 M6 44 Q32 37 58 44" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.2" />

    <!-- Simplified White Continents Outlines -->
    <path d="M28 8 Q38 6 50 14 Q56 20 52 26 Q40 24 34 28 Q26 22 28 8 Z" fill="#FFFFFF" fill-opacity="0.3" />
    <path d="M40 42 Q52 38 56 48 Q46 56 38 50 Z" fill="#FFFFFF" fill-opacity="0.3" />
    <path d="M10 26 Q20 20 26 30 Q22 48 12 44 Z" fill="#FFFFFF" fill-opacity="0.3" />

    <!-- Central GDR Badge Pill -->
    <rect x="22" y="21" width="37" height="20" rx="10" fill="#044E3A" stroke="#FFFFFF" stroke-width="1.8" />
    <!-- GDR Text -->
    <text x="40.5" y="35.5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">GDR</text>
  </g>

  <!-- Sphere Border Highlight -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#0F172A" stroke-width="2" />
</svg>